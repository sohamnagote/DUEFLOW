spring.application.name=dueflow-backend
server.port=${PORT:8080}

# Logging
logging.level.root=INFO
logging.level.in.dueflow=DEBUG
logging.level.org.springframework.security=INFO

# Spring Data JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# Datasource configuration with resilient H2 in PostgreSQL mode fallback
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:dueflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATASOURCE_USER:sa}
spring.datasource.password=${DATASOURCE_PASSWORD:}

# JSON
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=always
