server:
  port: ${PORT:8081}
  compression:
    enabled: true
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  application:
    name: dueflow-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/dueflow}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWKS_URI:${SUPABASE_URL:${NEXT_PUBLIC_SUPABASE_URL:https://placeholder.supabase.co}}/auth/v1/.well-known/jwks.json}
          issuer-uri: ${SUPABASE_JWT_ISSUER:${SUPABASE_URL:${NEXT_PUBLIC_SUPABASE_URL:https://placeholder.supabase.co}}/auth/v1}

dueflow:
  supabase:
    url: ${SUPABASE_URL:${NEXT_PUBLIC_SUPABASE_URL:}}
    publishable-key: ${SUPABASE_PUBLISHABLE_KEY:${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:}}
    secret-key: ${SUPABASE_SECRET_KEY:}
    jwt-secret: ${SUPABASE_JWT_SECRET:}
    storage-bucket: ${SUPABASE_STORAGE_BUCKET:dueflow-qr-codes}
  google:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:${GOOGLE_CLIENT_ID:}}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:${GOOGLE_CLIENT_SECRET:}}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:https://dueflow-backend.onrender.com/api/integrations/gmail/oauth/callback}
  security:
    encryption-key: ${GMAIL_TOKEN_ENCRYPTION_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://dueflow.vercel.app,https://dueflow-kappa.vercel.app,http://127.0.0.1:3000}
  app:
    base-url: ${APP_BASE_URL:https://dueflow-backend.onrender.com}
  frontend:
    base-url: ${FRONTEND_BASE_URL:https://dueflow-kappa.vercel.app}
  scheduler:
    enabled: ${REMINDER_SCHEDULER_ENABLED:true}
    interval-ms: 60000
    lock-at-least-for: 5000
  timezone: ${APP_TIMEZONE:Asia/Kolkata}

logging:
  level:
    root: INFO
    com.dueflow: INFO
    org.springframework.security: WARN
