server:
  port: 0

spring:
  application:
    name: dueflow-backend-test
  datasource:
    url: jdbc:h2:mem:dueflow_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

dueflow:
  supabase:
    url: https://mock.supabase.co
    publishable-key: mock-anon-key
    secret-key: mock-secret-key
    jwt-secret: mock-jwt-secret-that-is-long-enough-for-hs256-test-32bytes
    storage-bucket: test-bucket
  google:
    client-id: mock-google-client-id
    client-secret: mock-google-client-secret
    redirect-uri: http://localhost:8080/api/integrations/gmail/oauth/callback
  security:
    encryption-key: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  cors:
    allowed-origins: http://localhost:3000
  app:
    base-url: http://localhost:8080
  frontend:
    base-url: http://localhost:3000
  scheduler:
    enabled: false
    interval-ms: 60000
  timezone: Asia/Kolkata
